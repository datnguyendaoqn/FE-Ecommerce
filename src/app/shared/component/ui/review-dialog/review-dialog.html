<div class="p-3  max-w-full">
  
  <div class="flex items-center justify-between mb-6">
    <h2 mat-dialog-title class="text-2xl font-bold text-gray-800 p-0">
      Đánh giá sản phẩm
    </h2>
    <button (click)="onCancel()" class="text-gray-400 hover:text-gray-600">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="flex items-center gap-4 mb-6 p-4 bg-gray-50 rounded-lg border">
    <img 
      [src]="data.productImageUrl" 
      [alt]="data.productName"
      class="w-16 h-16 object-cover rounded-md"
    />
    <div class="flex-1">
      <p class="text-sm text-gray-600">Sản phẩm:</p>
      <p class="font-semibold text-gray-900 line-clamp-2">
        {{ data.productName }}
      </p>
    </div>
  </div>

  <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="p-0 m-0 space-y-6">
      
      <div>
        <label class="block text-lg font-semibold text-gray-700 mb-3 text-center">
          Chất lượng sản phẩm
        </label>
        <div 
          class="flex justify-center gap-3 text-gray-300"
          (mouseleave)="clearHoverRating()">
          @for (star of stars; track star) {
            <mat-icon
              class="!w-10 !h-10 !text-5xl cursor-pointer transition-transform duration-200 transform hover:scale-110"
              [class.text-yellow-400]="(hoverRating() || currentRating()) >= star"
              (mouseenter)="setHoverRating(star)"
              (click)="setRating(star)">
              {{ (hoverRating() || currentRating()) >= star ? 'star' : 'star_border' }}
            </mat-icon>
          }
        </div>
        @if (reviewForm.get('rating')?.touched && reviewForm.get('rating')?.invalid) {
          <p class="text-red-500 text-sm text-center mt-2">
            Vui lòng chọn ít nhất 1 sao
          </p>
        }
      </div>
      
      <div>
        <label for="commentText" class="block text-sm font-medium text-gray-700 mb-2">
          Viết bình luận của bạn (không bắt buộc)
        </label>
        <textarea
          id="commentText"
          formControlName="commentText"
          rows="5"
          placeholder="Sản phẩm rất tuyệt vời..."
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-colors"
        ></textarea>
      </div>

    </mat-dialog-content>

    <mat-dialog-actions align="end" class="mt-8 p-0">
      <button 
        type="button" 
        (click)="onCancel()"
        class="px-6 py-3 mr-3 rounded-xl border-2 border-gray-300 text-gray-700 hover:bg-gray-50 font-medium transition-all">
        Để sau
      </button>
      <button 
        type="submit"
        class="px-6 py-3 rounded-xl bg-gradient-to-r from-primary-600 to-primary-700 text-white hover:shadow-lg font-medium transition-all flex items-center gap-2">
        Gửi Đánh Giá
      </button>
    </mat-dialog-actions>
  </form>
</div>
