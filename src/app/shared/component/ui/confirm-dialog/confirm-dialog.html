<div class="p-6">
  <div class="flex items-start gap-4">
    <div class="flex-shrink-0 w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
      <mat-icon class="text-blue-600">info</mat-icon>

    </div>
    <div>
      <h2 mat-dialog-title class="text-xl font-bold text-gray-900 p-0 mb-2">
        {{ data.title || 'Xác nhận hành động' }}
      </h2>
      <mat-dialog-content class="text-gray-600 p-0 m-0">
        <p [innerHTML]="data.message"></p>
      </mat-dialog-content>
    </div>
  </div>

  <mat-dialog-actions align="end" class="mt-6 p-0">
    <button 
      mat-button 
      (click)="onCancel()"
      class="px-5 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300 transition-colors">
      {{ data.cancelText || 'Hủy' }}
    </button>
    <button 
      mat-button 
      (click)="onConfirm()"
      cdkFocusInitial
      class="px-5 py-2 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700 transition-colors">
      {{ data.confirmText || 'Xác nhận' }}
    </button>
  </mat-dialog-actions>
</div>
