<div class="relative">
  <!-- Close button -->
  <button 
    (click)="onCancel()"
    class="absolute top-4 right-4 w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center transition-colors z-10"
    aria-label="Đóng"
  >
    <mat-icon class="text-gray-400  text-xl">close</mat-icon>
  </button>

  <div class="p-6 pb-4">
    <!-- Icon & Header -->
    <div class="flex items-start gap-4 mb-4">
      <div class="flex-shrink-0 w-14 h-14 rounded-full bg-gradient-to-br from-blue-100 to-blue-50 flex items-center justify-center shadow-sm">
        <mat-icon class="text-blue-600">info</mat-icon>
      </div>
      <div class="flex-1 pt-1">
        <h2 class="text-xl font-bold text-gray-900 mb-2">
          {{ data.title || 'Xác nhận hành động' }}
        </h2>
        <div class="text-gray-600 leading-relaxed">
          <p [innerHTML]="data.message"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="bg-gray-50 px-6 py-4 flex items-center justify-end gap-3 border-t border-gray-100">
    <button 
      (click)="onCancel()"
      class="px-6 py-2.5 rounded-lg bg-white border-2 border-gray-200 text-gray-700 font-semibold hover:bg-gray-50 hover:border-gray-300 active:scale-95 transition-all">
      {{ data.cancelText || 'Hủy' }}
    </button>
    <button 
      (click)="onConfirm()"
      cdkFocusInitial
      class="px-6 py-2.5 rounded-lg bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold hover:from-blue-700 hover:to-blue-800 active:scale-95 transition-all shadow-sm hover:shadow">
      {{ data.confirmText || 'Xác nhận' }}
    </button>
  </div>
</div>
