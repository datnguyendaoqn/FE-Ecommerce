<div class="container mx-auto max-w-5xl min-h-screen p-2 sm:p-4">
  <!-- Tabs -->
  <nav class="bg-white shadow-sm rounded-t-lg mb-4">
    <div class="flex border-b overflow-x-auto no-scrollbar">
      <button
        *ngFor="let tab of tabs"
        (click)="setActiveTab(tab.value)"
        [ngClass]="{
          'border-blue-500 text-blue-500': activeTab === tab.value,
          'border-transparent text-gray-600 hover:text-blue-500': activeTab !== tab.value
        }"
        class="py-3 px-4 text-sm sm:text-base border-b-2 font-semibold flex-shrink-0"
      >
        {{ tab.label }}
      </button>
    </div>
  </nav>

  <!-- Search -->
  <div class="bg-white p-3 sm:p-4 rounded-b-lg mb-4 shadow-sm">
    <div class="relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
        <i data-lucide="search" class="w-5 h-5"></i>
      </span>
      <input
        type="text"
        placeholder="Tìm kiếm theo tên Shop, ID đơn hàng hoặc tên sản phẩm"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange($event)"
        class="w-full pl-10 pr-4 py-2 border bg-gray-50 border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 text-sm"
      />
    </div>
  </div>

  <!-- Orders -->
  <main class="space-y-4">
    <div *ngIf="isLoading" class="flex justify-center items-center h-64">
      <svg class="animate-spin h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24">
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
    </div>

    <div *ngIf="!isLoading && filteredOrders().length === 0" class="text-center py-16">
      <p class="text-gray-500 mt-2">Chưa có đơn hàng nào trong mục này.</p>
    </div>

    <div
      *ngFor="let order of filteredOrders()"
      class="bg-white rounded-lg shadow-sm overflow-hidden"
    >
      <!-- Header -->
      <header class="p-3 sm:p-4 border-b flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <span class="font-semibold text-sm sm:text-base">{{ order?.shopName }}</span>
        </div>
        <div
          class="text-sm font-semibold"
          [ngClass]="{
            'text-orange-500': order?.status?.toLowerCase() === 'pending',
            'text-blue-600': order?.status?.toLowerCase() === 'shipped',
            'text-green-600': order?.status?.toLowerCase() === 'completed',
            'text-gray-500': order?.status?.toLowerCase() === 'cancelled'
          }"
        >
          {{ getStatusText(order?.status) }}
        </div>
      </header>

      <!-- Products - CHỈ HIỂN THỊ CÁC ITEM ĐƯỢC PHÉP -->
      <div
        *ngFor="let item of getDisplayedItems(order)"
        class="p-3 sm:p-4 border-b hover:bg-gray-50"
      >
        <div class="flex space-x-3 sm:space-x-4">
          <img
            [src]="item?.imageUrl || 'assets/images/default-product.png'"
            alt="Sản phẩm"
            class="w-20 h-20 object-cover rounded-md border flex-shrink-0"
          />
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-sm sm:text-base truncate">{{ item?.productName }}</p>
            <p class="text-sm text-gray-500 truncate">{{ item?.variantName }}</p>
            <p class="text-sm text-gray-600 mt-1">Số lượng: {{ item?.quantity }}</p>
          </div>
          <div class="flex flex-col justify-between items-end flex-shrink-0">
            <div class="text-blue-600 font-semibold text-sm sm:text-base whitespace-nowrap">
              {{ item?.price | number }}₫
            </div>
          </div>
        </div>
        
        <!-- Nút đánh giá nằm dưới sản phẩm -->
        <div 
          *ngIf="order?.status?.toLowerCase() === 'completed'"
          class="mt-3 flex justify-end"
        >
          <button
            (click)="handleReviewItem(order, item)"
            class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 text-sm font-medium transition-colors"
          >
            Đánh Giá Sản Phẩm
          </button>
        </div>
      </div>

      <!-- NÚT XEM THÊM / THU GỌN -->
      <div 
        *ngIf="shouldShowExpandButton(order)"
        class="px-3 sm:px-4 py-2 border-b bg-gray-50"
      >
        <button
          (click)="toggleExpandOrder(order.id)"
          class="w-full flex items-center justify-center space-x-2 text-blue-600 hover:text-blue-700 font-medium text-sm py-2 transition-colors"
        >
          <span *ngIf="!isOrderExpanded(order.id)">
            Xem thêm {{ getRemainingItemsCount(order) }} sản phẩm
          </span>
          <span *ngIf="isOrderExpanded(order.id)">Thu gọn</span>
          
          <!-- Icon mũi tên -->
          <svg 
            class="w-4 h-4 transition-transform duration-200"
            [ngClass]="{ 'rotate-180': isOrderExpanded(order.id) }"
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
      </div>

      <!-- Footer -->
      <footer
        class="p-3 sm:p-4 bg-gray-50 flex flex-col sm:flex-row justify-between items-stretch sm:items-center space-y-2 sm:space-y-0 sm:space-x-2"
      >
        <div class="flex items-center space-x-2">
          <span class="text-gray-700 text-sm">Thành tiền:</span>
          <span class="text-blue-500 text-xl sm:text-2xl font-bold"
            >{{ order?.totalAmount | number }}₫</span
          >
        </div>
        <div class="flex space-x-2 flex-wrap">
          <button
            *ngIf="order?.status?.toLowerCase() === 'shipped'"
            (click)="confirmReceived(order)"
            class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 text-sm font-medium"
          >
            Đã nhận hàng
          </button>
          <button
            *ngIf="order?.status?.toLowerCase() === 'pending'"
            (click)="cancelOrder(order)"
            class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 text-sm font-medium"
          >
            Hủy đơn hàng
          </button>
          <button
            *ngIf="order?.status?.toLowerCase() === 'cancelled'"
            (click)="handleBuyAgain(order.id)"
            class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 text-sm font-medium"
          >
            Mua Lại
          </button>
        </div>
      </footer>
    </div>
  </main>
</div>
