<div class="max-w-7xl mx-auto p-8 bg-gray-50 min-h-screen">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-4xl font-bold text-primary-800">
      {{ isEditMode ? 'Chỉnh sửa Sản phẩm' : 'Tạo Sản phẩm mới' }}
    </h1>
    <a
      routerLink="/seller/products"
      class="flex items-center gap-2 text-primary-700 font-medium py-3 px-6 rounded-lg hover:bg-primary-50 transition-colors"
    >
      <mat-icon>arrow_back</mat-icon>
      <span>Quay lại Danh sách</span>
    </a>
  </div>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="grid grid-cols-3 gap-8">
    <div class="col-span-3 lg:col-span-2 space-y-6">
      <div class="bg-white shadow-card rounded-xl p-8">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Thông tin chung</h2>
        <div class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Tên sản phẩm</label>
            <input
              type="text"
              formControlName="name"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Mô tả</label>
            <textarea
              formControlName="description"
              rows="5"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
            ></textarea>
          </div>
        </div>
      </div>

      <div class="bg-white shadow-card rounded-xl p-8" formArrayName="variants">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-semibold text-gray-800">Các biến thể (Size, Màu sắc)</h2>
          <button
            type="button"
            (click)="addVariant()"
            class="flex items-center gap-2 text-sm bg-secondary-100 text-secondary-700 font-bold py-2 px-4 rounded-lg hover:bg-secondary-200 transition-all"
          >
            <mat-icon>add</mat-icon>
            <span>Thêm biến thể</span>
          </button>
        </div>

        @for (variant of variants.controls; track $index) {
        <div [formGroupName]="$index" class="grid grid-cols-12 gap-4 border-t border-gray-100 py-6">
          <div class="col-span-12 md:col-span-6">
            <label class="block text-xs font-medium text-gray-700 mb-2">SKU (Mã)</label>
            <input type="text" formControlName="sku" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg" />
          </div>
          <div class="col-span-6 md:col-span-3">
            <label class="block text-xs font-medium text-gray-700 mb-2">Size</label>
            <input type="text" formControlName="variantSize" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg" />
          </div>
          <div class="col-span-6 md:col-span-3">
            <label class="block text-xs font-medium text-gray-700 mb-2">Màu sắc</label>
            <input type="text" formControlName="color" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg" />
          </div>
          <div class="col-span-6 md:col-span-4">
            <label class="block text-xs font-medium text-gray-700 mb-2">Giá (VND)</label>
            <input type="number" formControlName="price" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg" />
          </div>
          <div class="col-span-6 md:col-span-4">
            <label class="block text-xs font-medium text-gray-700 mb-2">Tồn kho</label>
            <input type="number" formControlName="quantity" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg" />
          </div>
          <div class="col-span-12 md:col-span-4 flex items-end">
            <button
              type="button"
              (click)="removeVariant($index)"
              class="p-2 text-danger-600 hover:text-danger-800 hover:bg-danger-100 rounded-full transition-colors mt-4"
            >
              <mat-icon>delete</mat-icon>
              <span>Xóa</span>
            </button>
          </div>
        </div>
        }
      </div>
    </div>

    <div class="col-span-3 lg:col-span-1 space-y-6">
      <div class="bg-white shadow-card rounded-xl p-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Tổ chức</h2>
        <div class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Thương hiệu</label>
            <input type="text" formControlName="brand" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg" />
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Danh mục</label>
            <select formControlName="categoryId" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-white">
              <option [value]="null" disabled>Chọn danh mục</option>
              @if(categories$ | async; as categories) {
                @for(cat of categories; track cat.id) {
                  <option [value]="cat.id">{{ cat.name }}</option>
                }
              }
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Trạng thái</label>
            <select formControlName="status" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-white">
              <option value="active">Đang bán</option>
              <option value="inactive">Ngừng bán</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="bg-white shadow-card rounded-xl p-8">
         <h2 class="text-xl font-semibold text-gray-800 mb-6">Hình ảnh</h2>
         <button type="button" (click)="addMockMedia()" class="w-full text-center py-4 border-2 border-dashed border-primary-300 text-primary-600 rounded-lg hover:bg-primary-50">
           Thêm ảnh (Mock)
         </button>
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-success-600 to-success-700 hover:from-success-700 hover:to-success-800 text-white font-bold py-4 px-6 rounded-lg shadow-button hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5 disabled:opacity-70 disabled:cursor-not-allowed"
      >
        <mat-icon>{{ isLoading ? 'hourglass_empty' : (isEditMode ? 'save' : 'add_circle') }}</mat-icon>
        <span>{{ isLoading ? 'Đang lưu...' : (isEditMode ? 'Lưu thay đổi' : 'Tạo sản phẩm') }}</span>
      </button>
    </div>
  </form>
</div>
