<div class="space-y-6">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (stat of stats; track stat.title) {
      <div class="bg-white p-6 rounded-xl shadow-md flex items-center space-x-4">
        <div 
          class="w-12 h-12 rounded-full flex items-center justify-center text-white"
          [ngClass]="stat.color"
        >
          <mat-icon>{{ stat.icon }}</mat-icon>
        </div>
        <div>
          <p class="text-sm text-gray-500">{{ stat.title }}</p>
          <p class="text-2xl font-bold text-gray-800">{{ stat.value }}</p>
        </div>
      </div>
    }
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">Biểu đồ Doanh thu (7 ngày)</h3>
      <div class="h-64 bg-gray-200 rounded-lg flex items-center justify-center">
        <p class="text-gray-500">[Dữ liệu biểu đồ sẽ được hiển thị ở đây]</p>
      </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-md">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">Top Bán chạy</h3>
      <ul class="space-y-4">
        <li class="flex items-center space-x-3">
          <img 
            class="w-12 h-12 rounded-lg object-cover" 
            src="https://res.cloudinary.com/ddqg9afsy/image/upload/v1762409940/bxqy4mvsgy7ws4uc5orn.jpg" 
            alt="Product">
          <div>
            <p class="font-medium text-gray-800">Áo Thun Nam Cotton</p>
            <p class="text-sm text-gray-500">Đã bán: 150</p>
          </div>
        </li>
        <li class="flex items-center space-x-3">
          <img 
            class="w-12 h-12 rounded-lg object-cover" 
            src="https://res.cloudinary.com/ddqg9afsy/image/upload/v1762409908/tbehhqpenv9mzrlioerq.jpg" 
            alt="Product">
          <div>
            <p class="font-medium text-gray-800">Áo Polo Trơn</p>
            <p class="text-sm text-gray-500">Đã bán: 120</p>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
